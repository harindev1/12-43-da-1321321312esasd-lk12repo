<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harin Shop - 툴 전달 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        /* Admin Page */
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            display: none;
        }

        .admin-container.active {
            display: block;
        }

        .admin-header {
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .admin-header p {
            font-size: 14px;
            color: #666666;
        }

        .upload-section {
            background-color: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 40px;
        }

        .upload-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: block;
            padding: 12px 16px;
            border: 2px dashed #d5d5d5;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            font-size: 14px;
            color: #666666;
        }

        .file-input-label:hover {
            border-color: #1a1a1a;
        }

        #fileInput {
            display: none;
        }

        .file-name {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            color: #1a1a1a;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-primary {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #333333;
        }

        .btn-primary:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #f0f0f0;
            color: #1a1a1a;
            border: 1px solid #e5e5e5;
        }

        .btn-secondary:hover {
            background-color: #e5e5e5;
        }

        .loading-bar {
            width: 100%;
            height: 4px;
            background-color: #e5e5e5;
            border-radius: 2px;
            margin-top: 12px;
            display: none;
            overflow: hidden;
        }

        .loading-bar.active {
            display: block;
        }

        .loading-bar-fill {
            height: 100%;
            background-color: #1a1a1a;
            width: 0%;
            transition: width 0.3s;
        }

        .products-list {
            margin-top: 40px;
        }

        .products-list h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .product-item {
            background-color: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .product-description {
            font-size: 13px;
            color: #666666;
            margin-bottom: 12px;
        }

        .product-link {
            font-size: 12px;
            color: #0066cc;
            word-break: break-all;
            padding: 8px 12px;
            background-color: #f0f7ff;
            border-radius: 4px;
            display: inline-block;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-left: 20px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy {
            background-color: #e5e5e5;
            color: #1a1a1a;
        }

        .btn-copy:hover {
            background-color: #d5d5d5;
        }

        .btn-delete {
            background-color: #ffebee;
            color: #c62828;
        }

        .btn-delete:hover {
            background-color: #ffcdd2;
        }

        /* Download Page */
        .download-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            display: none;
        }

        .download-container.active {
            display: flex;
        }

        .download-card {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 48px 40px;
            text-align: center;
        }

        .download-header {
            margin-bottom: 32px;
        }

        .download-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .download-header p {
            font-size: 14px;
            color: #666666;
            line-height: 1.6;
        }

        .tool-name {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin: 32px 0;
            padding: 20px;
            background-color: #fafafa;
            border-radius: 8px;
        }

        .download-button {
            width: 100%;
            padding: 16px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.2s;
        }

        .download-button:hover {
            background-color: #333333;
        }

        .terms-section {
            margin: 32px 0;
            text-align: left;
        }

        .terms-title {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .terms-content {
            max-height: 300px;
            overflow-y: auto;
            background-color: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 16px;
            font-size: 12px;
            line-height: 1.6;
            color: #666666;
        }

        .terms-content::-webkit-scrollbar {
            width: 6px;
        }

        .terms-content::-webkit-scrollbar-track {
            background-color: #f0f0f0;
        }

        .terms-content::-webkit-scrollbar-thumb {
            background-color: #d5d5d5;
            border-radius: 3px;
        }

        .thank-you {
            font-size: 14px;
            color: #666666;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 8px;
            margin-top: 24px;
            line-height: 1.8;
        }

        .expiration-notice {
            font-size: 12px;
            color: #ff6b6b;
            margin-top: 16px;
            padding: 12px;
            background-color: #ffe0e0;
            border-radius: 6px;
        }

        .error-page {
            display: none;
        }

        .error-page.active {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .error-card {
            text-align: center;
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 500px;
        }

        .error-card h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #c62828;
        }

        .error-card p {
            font-size: 14px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .error-card .btn-secondary {
            display: inline-block;
        }

        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 48px 40px;
            text-align: center;
        }

        .login-card h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-card p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 32px;
        }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .login-card input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .login-card .btn-primary {
            width: 100%;
        }

        @media (max-width: 600px) {
            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .product-actions {
                margin-left: 0;
                margin-top: 16px;
                width: 100%;
            }

            .btn-small {
                flex: 1;
            }

            .download-card,
            .login-card {
                padding: 32px 24px;
            }

            .download-header h1,
            .login-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-card">
            <h1>Harin Shop</h1>
            <p>관리자 로그인</p>
            <input type="password" id="keyInput" placeholder="관리자 KEY 입력" />
            <button class="btn btn-primary" onclick="login()">로그인</button>
        </div>
    </div>

    <!-- Admin Page -->
    <div class="admin-container" id="adminPage">
        <div class="admin-header">
            <h1>Harin Shop</h1>
            <p>구매한 사용자들에게 툴을 전달하세요</p>
        </div>

        <div class="upload-section">
            <h2>상품 업로드</h2>
            <div class="form-group">
                <label for="productName">상품명</label>
                <input type="text" id="productName" placeholder="예: 디스코드 봇 v1.0">
            </div>

            <div class="form-group">
                <label for="productDescription">상품 설명</label>
                <textarea id="productDescription" rows="3" placeholder="상품에 대한 간단한 설명을 입력하세요"></textarea>
            </div>

            <div class="form-group">
                <label for="fileInput">파일 선택</label>
                <div class="file-input-wrapper">
                    <label for="fileInput" class="file-input-label">클릭하여 파일 선택</label>
                    <input type="file" id="fileInput" onchange="updateFileName()">
                    <span class="file-name" id="fileName"></span>
                </div>
            </div>

            <div class="loading-bar" id="loadingBar">
                <div class="loading-bar-fill" id="loadingBarFill"></div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="uploadBtn" onclick="uploadProduct()">상품 업로드</button>
                <button class="btn btn-secondary" onclick="logout()">로그아웃</button>
            </div>
        </div>

        <div class="products-list">
            <h2>업로드된 상품</h2>
            <div id="productsList"></div>
        </div>
    </div>

    <!-- Download Page -->
    <div class="download-container" id="downloadPage">
        <div class="download-card">
            <div class="download-header">
                <h1>Harin Shop</h1>
                <p>구매해주셔서 감사합니다!</p>
            </div>

            <div id="toolInfo">
                <div class="tool-name" id="toolName"></div>
                <button class="download-button" onclick="downloadFile()">파일 다운로드</button>

                <div class="terms-section">
                    <div class="terms-title">이용약관</div>
                    <div class="terms-content" id="termsContent"></div>
                </div>

                <div class="thank-you">
                    이 파일은 <strong>10시간</strong> 후 자동으로 만료됩니다.<br>
                    지정된 시간 내에 다운로드해주세요.
                </div>

                <div class="expiration-notice" id="expirationNotice"></div>
            </div>

            <div id="expiredMessage" style="display: none;">
                <h2 style="color: #c62828; font-size: 20px; margin-bottom: 16px;">링크가 만료되었습니다</h2>
                <p style="color: #666666; font-size: 14px;">이 다운로드 링크는 10시간이 지나 만료되었습니다.<br>판매자에게 문의해주세요.</p>
            </div>
        </div>
    </div>

    <!-- Error Page -->
    <div class="error-page" id="errorPage">
        <div class="error-card">
            <h1>⚠️ 오류</h1>
            <p id="errorMessage"></p>
            <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
        </div>
    </div>

    <script>
        const ADMIN_KEY = 'harinkey';
        const HOURS_DURATION = 10;
        let db;

        // IndexedDB 초기화
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('HarinShopDB', 1);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('products')) {
                        db.createObjectStore('products', { keyPath: 'id' });
                    }
                };
            });
        }

        // IndexedDB에서 상품 가져오기
        function getProducts() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['products'], 'readonly');
                const store = transaction.objectStore('products');
                const request = store.getAll();

                request.onsuccess = () => {
                    const products = {};
                    request.result.forEach(product => {
                        products[product.id] = product;
                    });
                    resolve(products);
                };

                request.onerror = () => reject(request.error);
            });
        }

        // IndexedDB에 상품 저장
        function saveProduct(linkId, productData) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['products'], 'readwrite');
                const store = transaction.objectStore('products');
                const request = store.put({ id: linkId, ...productData });

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // IndexedDB에서 상품 삭제
        function deleteProduct(linkId) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['products'], 'readwrite');
                const store = transaction.objectStore('products');
                const request = store.delete(linkId);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        // 로그인
        function login() {
            const key = document.getElementById('keyInput').value;
            if (key === ADMIN_KEY) {
                sessionStorage.setItem('admin_logged_in', 'true');
                showAdminPage();
            } else {
                alert('잘못된 KEY입니다.');
            }
        }

        // 로그아웃
        function logout() {
            sessionStorage.removeItem('admin_logged_in');
            showLoginPage();
        }

        // 파일명 업데이트
        function updateFileName() {
            const file = document.getElementById('fileInput').files[0];
            const fileNameSpan = document.getElementById('fileName');
            if (file) {
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                fileNameSpan.textContent = `선택된 파일: ${file.name} (${sizeMB}MB)`;
            }
        }

        // 상품 업로드
        async function uploadProduct() {
            const name = document.getElementById('productName').value.trim();
            const description = document.getElementById('productDescription').value.trim();
            const file = document.getElementById('fileInput').files[0];

            if (!name || !description || !file) {
                alert('모든 항목을 입력해주세요.');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            const loadingBar = document.getElementById('loadingBar');
            const loadingBarFill = document.getElementById('loadingBarFill');

            uploadBtn.disabled = true;
            loadingBar.classList.add('active');

            try {
                const fileData = await readFileAsArrayBuffer(file);
                const linkId = generateLinkId();
                const expirationTime = new Date().getTime() + HOURS_DURATION * 60 * 60 * 1000;

                await saveProduct(linkId, {
                    name: name,
                    description: description,
                    file: fileData,
                    fileName: file.name,
                    createdAt: new Date().getTime(),
                    expirationTime: expirationTime
                });

                clearUploadForm();
                await loadProductsList();
                loadingBar.classList.remove('active');
                uploadBtn.disabled = false;
                loadingBarFill.style.width = '0%';

                const downloadLink = `${window.location.href.split('?')[0]}?download=${linkId}`;
                alert(`✅ 상품이 업로드되었습니다!\n\n다운로드 링크:\n${downloadLink}`);
            } catch (error) {
                console.error('Upload error:', error);
                alert('업로드 중 오류가 발생했습니다.');
                uploadBtn.disabled = false;
                loadingBar.classList.remove('active');
            }
        }

        // 파일을 ArrayBuffer로 읽기
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                let lastUpdate = 0;

                reader.onprogress = (e) => {
                    const now = Date.now();
                    if (now - lastUpdate > 100) {
                        const progress = (e.loaded / e.total) * 100;
                        document.getElementById('loadingBarFill').style.width = progress + '%';
                        lastUpdate = now;
                    }
                };

                reader.onload = () => {
                    document.getElementById('loadingBarFill').style.width = '100%';
                    resolve(reader.result);
                };

                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(file);
            });
        }

        // 랜덤 링크 ID 생성
        function generateLinkId() {
            return 'link_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        }

        // 업로드 폼 초기화
        function clearUploadForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productDescription').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('fileName').textContent = '';
        }

        // 상품 목록 로드
        async function loadProductsList() {
            const products = await getProducts();
            const listDiv = document.getElementById('productsList');

            if (Object.keys(products).length === 0) {
                listDiv.innerHTML = '<p style="color: #999; font-size: 14px;">아직 업로드된 상품이 없습니다.</p>';
                return;
            }

            listDiv.innerHTML = Object.entries(products).map(([linkId, product]) => {
                const expirationDate = new Date(product.expirationTime).toLocaleString('ko-KR');
                const link = `${window.location.href.split('?')[0]}?download=${linkId}`;
                return `
                    <div class="product-item">
                        <div class="product-info">
                            <div class="product-name">${escapeHtml(product.name)}</div>
                            <div class="product-description">${escapeHtml(product.description)}</div>
                            <div class="product-link">링크: ${link}</div>
                            <div style="font-size: 12px; color: #999; margin-top: 8px;">
                                만료: ${expirationDate}
                            </div>
                        </div>
                        <div class="product-actions">
                            <button class="btn-small btn-copy" onclick="copyToClipboard('${link}')">링크 복사</button>
                            <button class="btn-small btn-delete" onclick="deleteProductClick('${linkId}')">삭제</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 링크 복사
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('링크가 복사되었습니다!');
            });
        }

        // 상품 삭제
        async function deleteProductClick(linkId) {
            if (confirm('이 상품을 삭제하시겠습니까?')) {
                await deleteProduct(linkId);
                await loadProductsList();
            }
        }

        // 다운로드 파일
        async function downloadFile() {
            const params = new URLSearchParams(window.location.search);
            const linkId = params.get('download');
            const products = await getProducts();
            const product = products[linkId];

            if (product) {
                const blob = new Blob([product.file]);
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = product.fileName;
                link.click();
                URL.revokeObjectURL(url);
            }
        }

        // HTML 특수문자 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 페이지 표시
        function showLoginPage() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminPage').classList.remove('active');
            document.getElementById('downloadPage').classList.remove('active');
            document.getElementById('errorPage').classList.remove('active');
        }

        function showAdminPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').classList.add('active');
            document.getElementById('downloadPage').classList.remove('active');
            document.getElementById('errorPage').classList.remove('active');
            loadProductsList();
        }

        function showDownloadPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').classList.remove('active');
            document.getElementById('downloadPage').classList.add('active');
            document.getElementById('errorPage').classList.remove('active');
        }

        function showErrorPage(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').classList.remove('active');
            document.getElementById('downloadPage').classList.remove('active');
            document.getElementById('errorPage').classList.add('active');
        }

        function goHome() {
            window.location.href = window.location.href.split('?')[0];
        }

        // 초기 페이지 로드
        async function initPage() {
            await initDB();

            const params = new URLSearchParams(window.location.search);
            const downloadId = params.get('download');

            if (downloadId) {
                const products = await getProducts();
                const product = products[downloadId];

                if (!product) {
                    showErrorPage('요청한 상품을 찾을 수 없습니다.');
                    return;
                }

                // 링크 만료 확인
                if (new Date().getTime() > product.expirationTime) {
                    showDownloadPage();
                    document.getElementById('toolInfo').style.display = 'none';
                    document.getElementById('expiredMessage').style.display = 'block';
                    return;
                }

                // 남은 시간 계산
                const remainingTime = product.expirationTime - new Date().getTime();
                const remainingHours = Math.floor(remainingTime / (60 * 60 * 1000));
                const remainingMinutes = Math.floor((remainingTime % (60 * 60 * 1000)) / (60 * 1000));

                document.getElementById('toolName').textContent = product.name;
                document.getElementById('expirationNotice').innerHTML = 
                    `⏰ 남은 시간: <strong>${remainingHours}시간 ${remainingMinutes}분</strong>`;

                // 이용약관 로드
                loadTerms();

                showDownloadPage();
            } else if (sessionStorage.getItem('admin_logged_in')) {
                showAdminPage();
            } else {
                showLoginPage();
            }
        }

        // 이용약관 로드
        function loadTerms() {
            const termsText = `시행일자: 2026.08.30

본 약관은 Harin Shop(이하 "판매자")에서 판매하는 프로그램, 툴, 봇, 소스코드, 설치·세팅 및 기타 디지털 상품을 구매하는 모든 이용자에게 적용됩니다.

상품을 구매하고 결제 인증을 완료하는 경우 구매자는 본 약관과 각 상품의 설명 및 안내사항을 확인하고 동의한 것으로 봅니다.

제1조 | 상품 및 제공 범위
판매자는 카카오톡 봇, IRIS/DB봇, Discord 봇, 프로그램, 툴, 소스코드, 설치·세팅, 예제 코드 적용, 서버 운영 및 기타 디지털 상품을 판매할 수 있습니다.

제4조 | 환불 정책
상품이 전달되지 않았고 설치·세팅·개발 등의 작업도 시작되지 않은 경우 환불을 요청할 수 있습니다. 프로그램, 툴, 소스코드, 파일 등 디지털 상품은 전달 이후 복제 또는 보관이 가능한 특성이 있으므로, 상품이 정상적으로 제공된 이후에는 단순 변심에 의한 환불이 제한됩니다.

제6조 | 무단배포 및 재판매 금지
다음 행위는 금지됩니다: 상품 파일을 제3자에게 무단 공유 또는 배포, 프로그램 및 툴의 무단 재판매, 소스코드 전체 또는 일부를 복제하여 판매 등.

무단배포, 무단복제, 재판매 시 저작권 침해 또는 계약 위반 등에 따른 민사상 손해배상 및 형사상 책임 등 법적 조치가 진행될 수 있습니다.`;
            document.getElementById('termsContent').textContent = termsText;
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', initPage);

        // Enter 키 로그인
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && document.getElementById('keyInput').style.display !== 'none') {
                login();
            }
        });
    </script>
</body>
</html>
