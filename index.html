<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매 완료</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 430px;
            padding: 40px 30px;
            background: #15151c;
            border: 1px solid #292934;
            border-radius: 18px;
            text-align: center;
        }

        .check {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            color: #999;
            margin-bottom: 30px;
        }

        .download {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            background: white;
            color: black;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .download:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="box">
    <div class="check">✓</div>

    <h1>구매 완료</h1>

    <p>상품 구매가 완료되었습니다.<br>
       아래 버튼을 눌러 파일을 다운로드하세요.</p>

    <!-- 여기에 실제 파일 경로 입력 -->
    <a class="download"
       href="files/my-product.zip"
       download>
        파일 다운로드
    </a>
</div>

</body>
</html>
